<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="48 298 124 124" width="124" height="124" role="img" aria-labelledby="cortexel-archive-title cortexel-archive-desc"><ns0:title id="cortexel-archive-title">CORTEXEL historical profile mark</ns0:title><ns0:desc id="cortexel-archive-desc">Archived design extracted from a historical portfolio SVG. This image makes no current product or release claim.</ns0:desc><ns0:defs><ns0:filter id="edgeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <ns0:feGaussianBlur stdDeviation="2.4" result="b" />
      <ns0:feMerge><ns0:feMergeNode in="b" /><ns0:feMergeNode in="SourceGraphic" /></ns0:feMerge>
    </ns0:filter>
    <ns0:filter id="nodeShadow" x="-40%" y="-40%" width="180%" height="180%">
      <ns0:feDropShadow dx="0" dy="1.5" stdDeviation="2.4" flood-color="#000000" flood-opacity="0.38" />
    </ns0:filter>
