      <ns0:linearGradient id="ctxArtifactEdge" x1="0" y1="342" x2="0" y2="378" gradientUnits="userSpaceOnUse"><ns0:stop offset="0%" stop-color="#fdf4ff" /><ns0:stop offset="38%" stop-color="#e879f9" /><ns0:stop offset="100%" stop-color="#86198f" /></ns0:linearGradient>
