      <ns0:stop offset="0%" stop-color="#2a0a2e" />
      <ns0:stop offset="100%" stop-color="#10131a" />
    </ns0:radialGradient>
    </ns0:defs><ns0:style>.seat-ring{fill: none; stroke-width: 2.2;}
.seat-groove{fill: none; stroke: #05070b; stroke-opacity: 0.5; stroke-width: 1;}
