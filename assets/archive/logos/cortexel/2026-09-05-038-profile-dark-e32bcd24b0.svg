      <ns0:linearGradient id="ctxArtifactEdge" x1="0" y1="542" x2="0" y2="578" gradientUnits="userSpaceOnUse"><ns0:stop offset="0%" stop-color="#fdf4ff" /><ns0:stop offset="38%" stop-color="#e879f9" /><ns0:stop offset="100%" stop-color="#86198f" /></ns0:linearGradient>
      <ns0:clipPath id="ctxActionPotentialClip"><ns0:rect x="102.7" y="546" width="15.5" height="29">
