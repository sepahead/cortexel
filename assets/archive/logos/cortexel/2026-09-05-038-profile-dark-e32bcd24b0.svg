      <ns0:animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.11;0.28;0.32;1" dur="8.4s" repeatCount="indefinite" />
    </ns0:polygon>
    <ns0:line x1="93" y1="546" x2="93" y2="552" class="ctx-min-scan" opacity="0">
