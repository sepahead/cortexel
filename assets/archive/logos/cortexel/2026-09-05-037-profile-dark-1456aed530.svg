      </ns0:linearGradient>
    </ns0:defs>
    <ns0:g filter="url(#nodeShadow)"><ns0:circle cx="110" cy="484" r="34" class="seat-vox" /></ns0:g>
    <ns0:circle cx="110" cy="484" r="34" stroke="url(#voxBezel)" class="seat-ring" />
