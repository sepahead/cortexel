name: CI

# Runs only on direct pushes/PRs to this standalone mirror. No scheduled jobs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the build needs only read access to the checkout.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The generated contract must be fresh and deterministic, and the evidence ledger must
  # be structurally sound — a forged PASS or a drifted generated file fails here.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Generated files are fresh and generation is deterministic
        run: bun run check:generated
      - name: Evidence ledger is structurally valid (no forged PASS)
        run: bun run check:ledger

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Provision private reviewed Node for process-isolation tests
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          umask 077
          source_node="$(realpath -e -- "$(command -v node)")"
          runtime_root="$RUNNER_TEMP/cortexel-check-node-runtime"
          if [[ -e "$runtime_root" || -L "$runtime_root" ]]; then
            echo "::error::private check runtime path already exists"
            exit 1
          fi
          mkdir -m 0700 -- "$runtime_root"
          mkdir -m 0700 -- "$runtime_root/bin"
          install -m 0500 -- "$source_node" "$runtime_root/bin/node"
          if [[ "$(realpath -e -- "$runtime_root/bin/node")" != "$runtime_root/bin/node" \
            || "$(stat -c '%h:%a' -- "$runtime_root/bin/node")" != '1:500' ]]; then
            echo "::error::private check Node lacks unique immutable file authority"
            exit 1
          fi
          printf '%s\n' "$runtime_root/bin" >> "$GITHUB_PATH"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun run audit
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Validate package metadata
        run: bun run lint:package
      # dist/ is committed (git-dependency consumers install without a build
      # step), so guard that the committed artifacts + manifest are in sync with
      # source. A stale dist fails here instead of silently shipping old code.
      - name: Verify committed dist is fresh
        run: test -z "$(git status --porcelain --untracked-files=all -- dist)" || (git status --short -- dist && echo "::error::dist/ is stale — run 'bun run build' and commit dist/." && exit 1)

  # The proofs cover the saturating natural-number core and two provenance
  # non-identifiability laws. TypeScript property and parity tests in `check`
  # separately establish correspondence with the executable gates.
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          use-github-cache: false
      - name: Prove returned-row and provenance-identifiability laws
        run: lake build --wfail

  # The independent Python reader must pass its own suite. Cross-language digest parity is
  # asserted by the TypeScript suite (test/crossLanguageParity.test.ts) in `check`.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14.6']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - id: setup_uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.16
          enable-cache: false
      - name: Require Linux POSIX ACL tooling
        run: |
          command -v setfacl >/dev/null
          command -v getfacl >/dev/null
      - name: Seal exact Python and uv runtime authority
        if: matrix.python == '3.14.6'
        shell: bash
        env:
          SETUP_UV_PATH: ${{ steps.setup_uv.outputs['uv-path'] }}
          SETUP_UVX_PATH: ${{ steps.setup_uv.outputs['uvx-path'] }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          umask 022
          python_version="$(python -I -S -B -c \
            'import sys; print(".".join(str(value) for value in sys.version_info[:3]))')"
          python_base="$(python -I -S -B -c \
            'import pathlib, sys; print(pathlib.Path(sys.base_prefix).resolve(strict=True))')"
          python_executable="$(python -I -S -B -c \
            'import pathlib, sys; print(pathlib.Path(sys.executable).resolve(strict=True))')"
          python_location="$(realpath -e -- "$pythonLocation")"
          expected_python_location="/opt/hostedtoolcache/Python/3.14.6/x64"
          expected_python_executable="$expected_python_location/bin/python3.14"
          if [[ "$python_version" != "3.14.6" \
            || "$pythonLocation" != "$expected_python_location" \
            || "$python_location" != "$expected_python_location" \
            || "$python_base" != "$expected_python_location" \
            || "$python_executable" != "$expected_python_executable" ]]; then
            echo "::error::setup-python did not provide the exact canonical Python 3.14.6 authority"
            exit 1
          fi

          uv_executable="$SETUP_UV_PATH"
          uvx_executable="$SETUP_UVX_PATH"
          expected_uv_executable="/opt/hostedtoolcache/uv/0.11.16/x86_64/uv"
          expected_uvx_executable="/opt/hostedtoolcache/uv/0.11.16/x86_64/uvx"
          if [[ "$uv_executable" != "$expected_uv_executable" \
            || "$uvx_executable" != "$expected_uvx_executable" \
            || ! -f "$uv_executable" \
            || ! -f "$uvx_executable" \
            || -L "$uv_executable" \
            || -L "$uvx_executable" \
            || "$(realpath -e -- "$uv_executable")" != "$expected_uv_executable" \
            || "$(realpath -e -- "$uvx_executable")" != "$expected_uvx_executable" ]]; then
            echo "::error::setup-uv did not provide the exact canonical uv 0.11.16 authority"
            exit 1
          fi
          uv_version_output="$("$uv_executable" --version)"
          uv_version_pattern='^uv 0[.]11[.]16( [(][ -~]+[)])?$'
          if [[ ! $uv_version_output =~ $uv_version_pattern ]]; then
            echo "::error::setup-uv executable did not report exact uv 0.11.16"
            exit 1
          fi

          python_version_root="/opt/hostedtoolcache/Python/3.14.6"
          uv_version_root="/opt/hostedtoolcache/uv/0.11.16"
          authority_chain=(
            /opt
            /opt/hostedtoolcache
            /opt/hostedtoolcache/Python
            "$python_version_root"
            /opt/hostedtoolcache/uv
            "$uv_version_root"
          )
          for authority_directory in "${authority_chain[@]}"; do
            if [[ ! -d "$authority_directory" \
              || -L "$authority_directory" \
              || "$(realpath -e -- "$authority_directory")" != "$authority_directory" ]]; then
              echo "::error::runtime authority chain is not one canonical physical directory: $authority_directory"
              exit 1
            fi
          done

          for authority_root in "$python_version_root" "$uv_version_root"; do
            unexpected_entry="$(find -P "$authority_root" \
              ! -type d ! -type f ! -type l -print -quit)"
            if [[ -n "$unexpected_entry" ]]; then
              echo "::error::runtime authority contains a special filesystem entry: $unexpected_entry"
              exit 1
            fi
            while IFS= read -r -d '' authority_link; do
              authority_target="$(realpath -e -- "$authority_link")"
              if [[ "$authority_target" != "$authority_root" \
                && "$authority_target" != "$authority_root"/* ]]; then
                echo "::error::runtime authority symlink escapes its version root: $authority_link"
                exit 1
              fi
            done < <(find -P "$authority_root" -type l -print0)
          done

          sudo chown -R root:root -- "$python_version_root" "$uv_version_root"
          sudo setfacl -R -b -k -- "$python_version_root" "$uv_version_root"
          sudo chmod -R go-w -- "$python_version_root" "$uv_version_root"
          sudo chown root:root -- "${authority_chain[@]}"
          sudo setfacl -b -k -- "${authority_chain[@]}"
          sudo chmod go-w -- "${authority_chain[@]}"

          for authority_directory in "${authority_chain[@]}"; do
            if [[ "$(stat -c '%u:%g' -- "$authority_directory")" != "0:0" \
              || -n "$(find -P "$authority_directory" -maxdepth 0 -perm /022 -print -quit)" ]]; then
              echo "::error::runtime authority chain remains mutable: $authority_directory"
              exit 1
            fi
          done
          for authority_root in "$python_version_root" "$uv_version_root"; do
            unowned_entry="$(find -P "$authority_root" \
              \( ! -user root -o ! -group root \) -print -quit)"
            writable_entry="$(find -P "$authority_root" \
              \( -type d -o -type f \) -perm /022 -print -quit)"
            if [[ -n "$unowned_entry" || -n "$writable_entry" ]]; then
              echo "::error::runtime version root remains mutable: ${unowned_entry:-$writable_entry}"
              exit 1
            fi
          done
          set +e
          getfacl -R -c -p -P -- "$python_version_root" "$uv_version_root" \
            | awk '
              /^(default:|user:[^:]+:|group:[^:]+:|mask::)/ { extended = 1 }
              END { exit extended ? 42 : 0 }
            '
          acl_status=("${PIPESTATUS[@]}")
          set -e
          if (( acl_status[0] != 0 )); then
            echo "::error::runtime version-root ACL authority could not be inspected"
            exit 1
          fi
          if (( acl_status[1] == 42 )); then
            echo "::error::runtime version root retains extended ACL authority"
            exit 1
          elif (( acl_status[1] != 0 )); then
            echo "::error::runtime version-root ACL inspection failed"
            exit 1
          fi

          set +e
          getfacl -c -p -P -- "${authority_chain[@]}" \
            | awk '
              /^(default:|user:[^:]+:|group:[^:]+:|mask::)/ { extended = 1 }
              END { exit extended ? 42 : 0 }
            '
          acl_status=("${PIPESTATUS[@]}")
          set -e
          if (( acl_status[0] != 0 )); then
            echo "::error::runtime authority-chain ACLs could not be inspected"
            exit 1
          fi
          if (( acl_status[1] == 42 )); then
            echo "::error::runtime authority chain retains extended ACL authority"
            exit 1
          elif (( acl_status[1] != 0 )); then
            echo "::error::runtime authority-chain ACL inspection failed"
            exit 1
          fi
          test -x "$expected_python_executable"
          test -x "$expected_uv_executable"
          test -x "$expected_uvx_executable"
          printf '%s\n' "$(dirname "$expected_uv_executable")" >> "$GITHUB_PATH"
          {
            printf 'CORTEXEL_CI_UV=%s\n' "$expected_uv_executable"
            printf 'CORTEXEL_CI_UVX=%s\n' "$expected_uvx_executable"
          } >> "$GITHUB_ENV"
      - name: Compile Python reader
        run: python -m compileall -q python/src python/tests scripts/smoke-python-package.py scripts/inspect-posix-acl.py scripts/generate-nest-example-visualization-oracle.py
      - name: Python tests (stdlib and POSIX ACL integration)
        run: python -m unittest discover -s python/tests -v
      - name: Retained NEST oracle self-check (isolated, no site)
        run: python -I -S -B scripts/generate-nest-example-visualization-oracle.py --check docs/audit/nest-example-visualization-oracle.v1.json
      - name: Strict Python typing
        env:
          UVX_EXECUTABLE: ${{ steps.setup_uv.outputs['uvx-path'] }}
        run: |
          "$UVX_EXECUTABLE" --no-config --from mypy==1.19.1 mypy --config-file python/pyproject.toml python/src/cortexel
      - name: Python lint
        env:
          UVX_EXECUTABLE: ${{ steps.setup_uv.outputs['uvx-path'] }}
        run: |
          "$UVX_EXECUTABLE" --no-config --from ruff==0.15.18 ruff check python/src python/tests scripts/smoke-python-package.py scripts/inspect-posix-acl.py scripts/generate-nest-example-visualization-oracle.py
      - name: Provision exact hash-pinned Python build backend
        if: matrix.python == '3.14.6'
        run: |
          umask 022
          temporary="$(python -I -S -B -c 'import pathlib, sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$RUNNER_TEMP")"
          runtime="$temporary/cortexel-python-package-runtime"
          bootstrap_home="$temporary/cortexel-python-package-bootstrap-home"
          wheelhouse="$temporary/cortexel-python-package-backend-wheelhouse"
          python -m venv --copies --without-pip "$runtime"
          mkdir -p "$bootstrap_home"
          uv_path="$CORTEXEL_CI_UV"
          env -i \
            HOME="$bootstrap_home" \
            PATH="$(dirname "$runtime/bin/python"):/usr/bin:/bin" \
            TMPDIR="$temporary" \
            SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            /usr/bin/timeout --signal=TERM --kill-after=10s 300s \
            "$runtime/bin/python" -I -S -B scripts/smoke-python-package.py \
              bootstrap-backend-wheelhouse "$wheelhouse"
          env -i \
            HOME="$bootstrap_home" \
            PATH="$(dirname "$uv_path"):/usr/bin:/bin" \
            TMPDIR="$temporary" \
            UV_NO_CONFIG=1 \
            UV_NO_SYSTEM_CONFIG=1 \
            UV_NO_ENV_FILE=1 \
            UV_PYTHON_DOWNLOADS=never \
            UV_OFFLINE=1 \
            UV_LINK_MODE=copy \
            /usr/bin/timeout --signal=TERM --kill-after=10s 300s \
            "$uv_path" pip install \
              --no-config \
              --no-cache \
              --python "$runtime/bin/python" \
              --no-deps \
              --link-mode copy \
              --require-hashes \
              --only-binary :all: \
              --no-index \
              --find-links "$wheelhouse" \
              --requirements .github/requirements/python-package-build.txt
          {
            echo "CORTEXEL_PACKAGE_PYTHON=$runtime/bin/python"
            echo "CORTEXEL_UV=$uv_path"
            echo "CORTEXEL_BUILD_BACKEND_WHEELHOUSE=$wheelhouse"
          } >> "$GITHUB_ENV"
      - name: Reproducible wheel/sdist, clean install, and canonical result receipt
        if: matrix.python == '3.14.6'
        run: |
          umask 022
          temporary="$("$CORTEXEL_PACKAGE_PYTHON" -I -S -B -c \
            'import pathlib, sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' \
            "$RUNNER_TEMP")"
          result_parent="$temporary/cortexel-python-package-result"
          mkdir -m 0700 "$result_parent"
          result="$result_parent/result.v1.json"
          "$CORTEXEL_PACKAGE_PYTHON" -I -S -B scripts/smoke-python-package.py \
            verify --result-file "$result"
          "$CORTEXEL_PACKAGE_PYTHON" -I -S -B -c '
          import importlib.util
          import pathlib
          import sys
          script = pathlib.Path(sys.argv[1]).resolve(strict=True)
          spec = importlib.util.spec_from_file_location("cortexel_package_smoke", script)
          if spec is None or spec.loader is None:
              raise RuntimeError("cannot load the package-smoke result reader")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          result = module.read_python_package_smoke_result(
              pathlib.Path(sys.argv[2])
          )
          if result["contract"] != "cortexel-python-package-smoke-result.v1":
              raise RuntimeError("unexpected package-smoke result contract")
          ' scripts/smoke-python-package.py "$result"

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Materialize exact commit under private ACL-free authority
        id: package_source
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          umask 077

          command -v setfacl >/dev/null
          command -v getfacl >/dev/null
          bun_executable="$(realpath -e -- "$(command -v bun)")"
          node_executable="$(realpath -e -- "$(command -v node)")"
          npm_cli="$(realpath -e -- "$(command -v npm)")"
          workspace="$(realpath -e -- "$GITHUB_WORKSPACE")"
          workspace_parent="$(dirname -- "$workspace")"
          if [[ "$workspace" != "$GITHUB_WORKSPACE" \
            || "$(dirname -- "$workspace_parent")" != /home/runner/work ]]; then
            echo "::error::package-smoke checkout is outside the reviewed hosted-runner topology"
            exit 1
          fi
          commit="$(git -C "$workspace" rev-parse --verify 'HEAD^{commit}')"
          if [[ "$commit" != "$GITHUB_SHA" \
            || -n "$(git -C "$workspace" status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::package-smoke checkout is not the exact clean workflow commit"
            exit 1
          fi

          # The production ACL helper admits only reviewed ext-family/tmpfs
          # authority. Check the fixed parents before creating anything that
          # could inherit an unsupported ACL.
          set +e
          getfacl -c -p -P -- / /tmp \
            | awk '
              /^(default:|user:[^:]+:|group:[^:]+:|mask::)/ { extended = 1 }
              END { exit extended ? 42 : 0 }
            '
          acl_status=("${PIPESTATUS[@]}")
          set -e
          if (( acl_status[0] != 0 )); then
            echo "::error::package-smoke private-parent ACL authority could not be inspected"
            exit 1
          fi
          if (( acl_status[1] == 42 )); then
            echo "::error::package-smoke private parent retains an extended ACL"
            exit 1
          elif (( acl_status[1] != 0 )); then
            echo "::error::package-smoke private-parent ACL inspection failed"
            exit 1
          fi

          authority_root="$(mktemp -d \
            "/tmp/cortexel-package-smoke-node-${{ matrix.node }}.XXXXXXXX")"
          setfacl -b -k -- "$authority_root"
          chmod 0700 -- "$authority_root"
          source_root="$authority_root/source"
          mkdir -m 0755 -- "$source_root"
          mkdir -m 0700 -- "$authority_root/tmp"
          setfacl -b -k -- "$source_root" "$authority_root/tmp"
          if [[ "$(realpath -e -- "$authority_root")" != "$authority_root" \
            || "$(stat -c '%u:%a' -- "$authority_root")" != "$(id -u):700" \
            || "$(realpath -e -- "$source_root")" != "$source_root" \
            || "$(stat -c '%u:%a' -- "$source_root")" != "$(id -u):755" \
            || "$(realpath -e -- "$authority_root/tmp")" != "$authority_root/tmp" \
            || "$(stat -c '%u:%a' -- "$authority_root/tmp")" != "$(id -u):700" ]]; then
            echo "::error::package-smoke private source authority is not canonical"
            exit 1
          fi

          # Git trees used by this package contain only ordinary regular files.
          # Reject a future link/special entry before asking tar to materialize
          # the commit, then apply the repository's 0644/0755 mode projection
          # through the reviewed 0022 extraction mask.
          set +e
          git -C "$workspace" ls-tree -r \
            --format='%(objectmode) %(objecttype)' "$commit" \
            | awk '
              $0 != "100644 blob" && $0 != "100755 blob" { invalid = 1 }
              END { exit invalid ? 42 : 0 }
            '
          tree_status=("${PIPESTATUS[@]}")
          set -e
          if (( tree_status[0] != 0 )); then
            echo "::error::package-smoke commit tree could not be inspected"
            exit 1
          fi
          if (( tree_status[1] == 42 )); then
            echo "::error::package-smoke commit tree contains a link or unsupported entry"
            exit 1
          elif (( tree_status[1] != 0 )); then
            echo "::error::package-smoke commit-tree inspection failed"
            exit 1
          fi

          umask 022
          git -C "$workspace" archive --format=tar "$commit" \
            | tar --extract --directory="$source_root" \
                --no-same-owner --no-same-permissions
          umask 077
          if ! git --no-optional-locks \
            --git-dir="$workspace/.git" --work-tree="$source_root" \
            diff --quiet --no-ext-diff --no-textconv "$commit" -- \
            || [[ -n "$(git --no-optional-locks \
              --git-dir="$workspace/.git" --work-tree="$source_root" \
              status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::materialized package-smoke bytes or executable modes differ from the commit"
            exit 1
          fi
          unexpected_entry="$(find -P "$source_root" ! -type d ! -type f -print -quit)"
          linked_file="$(find -P "$source_root" -type f -links +1 -print -quit)"
          mode_drift="$(find -P "$source_root" \
            \( -type d ! -perm 0755 -o -type f ! -perm 0644 ! -perm 0755 \) \
            -print -quit)"
          if [[ -n "$unexpected_entry" || -n "$linked_file" || -n "$mode_drift" ]]; then
            echo "::error::materialized package-smoke source has unsupported filesystem authority"
            exit 1
          fi

          set +e
          getfacl -R -c -p -P -- "$source_root" \
            | awk '
              /^(default:|user:[^:]+:|group:[^:]+:|mask::)/ { extended = 1 }
              END { exit extended ? 42 : 0 }
            '
          acl_status=("${PIPESTATUS[@]}")
          set -e
          if (( acl_status[0] != 0 )); then
            echo "::error::materialized package-smoke source ACLs could not be inspected"
            exit 1
          fi
          if (( acl_status[1] == 42 )); then
            echo "::error::materialized package-smoke source retains an extended ACL"
            exit 1
          elif (( acl_status[1] != 0 )); then
            echo "::error::materialized package-smoke source ACL inspection failed"
            exit 1
          fi

          {
            printf 'authority_root=%s\n' "$authority_root"
            printf 'bun_executable=%s\n' "$bun_executable"
            printf 'node_executable=%s\n' "$node_executable"
            printf 'npm_cli=%s\n' "$npm_cli"
            printf 'source_root=%s\n' "$source_root"
            printf 'tool_path=%s\n' "$PATH"
          } >> "$GITHUB_OUTPUT"
      - name: Install in private package-smoke source
        shell: bash
        env:
          CORTEXEL_CI_BUN: ${{ steps.package_source.outputs.bun_executable }}
          CORTEXEL_CI_PACKAGE_SOURCE_ROOT: ${{ steps.package_source.outputs.source_root }}
          PATH: ${{ steps.package_source.outputs.tool_path }}
        run: |
          set -euo pipefail
          cd -- "$CORTEXEL_CI_PACKAGE_SOURCE_ROOT"
          "$CORTEXEL_CI_BUN" install --frozen-lockfile
      - name: Build in private package-smoke source
        shell: bash
        env:
          CORTEXEL_CI_BUN: ${{ steps.package_source.outputs.bun_executable }}
          CORTEXEL_CI_PACKAGE_SOURCE_ROOT: ${{ steps.package_source.outputs.source_root }}
          PATH: ${{ steps.package_source.outputs.tool_path }}
        run: |
          set -euo pipefail
          cd -- "$CORTEXEL_CI_PACKAGE_SOURCE_ROOT"
          "$CORTEXEL_CI_BUN" run build
          commit="$(git -C "$GITHUB_WORKSPACE" rev-parse --verify 'HEAD^{commit}')"
          if [[ "$commit" != "$GITHUB_SHA" \
            || -n "$(git --no-optional-locks \
              --git-dir="$GITHUB_WORKSPACE/.git" \
              --work-tree="$CORTEXEL_CI_PACKAGE_SOURCE_ROOT" \
              status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::private package-smoke build differs from the exact committed tree"
            exit 1
          fi
      - name: Package smoke under private copied runtime authority
        shell: bash
        env:
          CORTEXEL_CI_BUN: ${{ steps.package_source.outputs.bun_executable }}
          CORTEXEL_CI_NODE: ${{ steps.package_source.outputs.node_executable }}
          CORTEXEL_CI_NPM_CLI: ${{ steps.package_source.outputs.npm_cli }}
          CORTEXEL_CI_PACKAGE_AUTHORITY_ROOT: ${{ steps.package_source.outputs.authority_root }}
          CORTEXEL_CI_PACKAGE_SOURCE_ROOT: ${{ steps.package_source.outputs.source_root }}
          PATH: ${{ steps.package_source.outputs.tool_path }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          umask 077

          command -v setfacl >/dev/null
          command -v getfacl >/dev/null
          authority_root="$(realpath -e -- "$CORTEXEL_CI_PACKAGE_AUTHORITY_ROOT")"
          source_root="$(realpath -e -- "$CORTEXEL_CI_PACKAGE_SOURCE_ROOT")"
          if [[ "$authority_root" != "$CORTEXEL_CI_PACKAGE_AUTHORITY_ROOT" \
            || "$source_root" != "$CORTEXEL_CI_PACKAGE_SOURCE_ROOT" \
            || "$(dirname -- "$source_root")" != "$authority_root" \
            || "$(stat -c '%u:%a' -- "$authority_root")" != "$(id -u):700" \
            || "$(stat -c '%u:%a' -- "$source_root")" != "$(id -u):755" ]]; then
            echo "::error::package-smoke private source authority changed before execution"
            exit 1
          fi
          export TMPDIR="$authority_root/tmp"

          set +e
          getfacl -c -p -P -- \
            / \
            /tmp \
            "$authority_root" \
            "$TMPDIR" \
            "$source_root" \
            | awk '
              /^(default:|user:[^:]+:|group:[^:]+:|mask::)/ { extended = 1 }
              END { exit extended ? 42 : 0 }
            '
          acl_status=("${PIPESTATUS[@]}")
          set -e
          if (( acl_status[0] != 0 )); then
            echo "::error::package-smoke ACL authority could not be inspected"
            exit 1
          fi
          if (( acl_status[1] == 42 )); then
            echo "::error::package-smoke authority retains an extended ACL"
            exit 1
          elif (( acl_status[1] != 0 )); then
            echo "::error::package-smoke ACL inspection failed"
            exit 1
          fi

          source_node="$(realpath -e -- "$CORTEXEL_CI_NODE")"
          source_npm_cli="$(realpath -e -- "$CORTEXEL_CI_NPM_CLI")"
          if [[ "$source_node" != "$CORTEXEL_CI_NODE" \
            || "$source_npm_cli" != "$CORTEXEL_CI_NPM_CLI" ]]; then
            echo "::error::setup-node authority changed before private acquisition"
            exit 1
          fi
          if [[ "$(basename -- "$source_npm_cli")" != npm-cli.js \
            || "$(basename -- "$(dirname -- "$source_npm_cli")")" != bin ]]; then
            echo "::error::setup-node npm did not resolve to an npm package bin/npm-cli.js"
            exit 1
          fi
          source_npm_root="$(dirname -- "$(dirname -- "$source_npm_cli")")"

          runtime_root="$authority_root/runtime"
          if [[ -e "$runtime_root" || -L "$runtime_root" ]]; then
            echo "::error::private package runtime path already exists"
            exit 1
          fi
          mkdir -m 0700 -- "$runtime_root"
          mkdir -m 0700 -- "$runtime_root/bin"
          install -m 0500 -- "$source_node" "$runtime_root/bin/node"
          cp -R -P -- "$source_npm_root" "$runtime_root/npm"

          # Hosted toolcache modes and hard links are not package-smoke authority.
          # The recursive copy gives every regular file a distinct inode; normalize
          # the copied tree while retaining npm's internal relative symlinks.
          find -P "$runtime_root/npm" -type d -exec chmod 0755 -- {} +
          find -P "$runtime_root/npm" -type f -perm /111 -exec chmod 0755 -- {} +
          find -P "$runtime_root/npm" -type f ! -perm /111 -exec chmod 0644 -- {} +
          ln -s -- ../npm/bin/npm-cli.js "$runtime_root/bin/npm"

          unexpected_entry="$(find -P "$runtime_root" \
            ! -type d ! -type f ! -type l -print -quit)"
          linked_file="$(find -P "$runtime_root" -type f -links +1 -print -quit)"
          writable_entry="$(find -P "$runtime_root" \
            \( -type d -o -type f \) -perm /7022 -print -quit)"
          if [[ -n "$unexpected_entry" || -n "$linked_file" || -n "$writable_entry" ]]; then
            echo "::error::copied package runtime retains unsupported filesystem authority"
            exit 1
          fi
          if [[ "$(realpath -e -- "$runtime_root/bin/node")" != "$runtime_root/bin/node" \
            || "$(realpath -e -- "$runtime_root/bin/npm")" != "$runtime_root/npm/bin/npm-cli.js" ]]; then
            echo "::error::copied package runtime paths are not canonical"
            exit 1
          fi

          set +e
          getfacl -R -c -p -P -- "$runtime_root" \
            | awk '
              /^(default:|user:[^:]+:|group:[^:]+:|mask::)/ { extended = 1 }
              END { exit extended ? 42 : 0 }
            '
          runtime_acl_status=("${PIPESTATUS[@]}")
          set -e
          if (( runtime_acl_status[0] != 0 )); then
            echo "::error::copied package runtime ACLs could not be inspected"
            exit 1
          fi
          if (( runtime_acl_status[1] == 42 )); then
            echo "::error::copied package runtime retains an extended ACL"
            exit 1
          elif (( runtime_acl_status[1] != 0 )); then
            echo "::error::copied package runtime ACL inspection failed"
            exit 1
          fi

          node_major="$("$runtime_root/bin/node" -p 'process.versions.node.split(".")[0]')"
          npm_version="$("$runtime_root/bin/node" "$runtime_root/npm/bin/npm-cli.js" --version)"
          if [[ "$node_major" != "${{ matrix.node }}" \
            || ! "$npm_version" =~ ^(10|11)[.] ]]; then
            echo "::error::copied package runtime versions are outside the reviewed matrix"
            exit 1
          fi

          # The runtime modes are now explicit and immutable for this job. Use the
          # reviewed package-install mask so extracted files retain tar member modes.
          # Hosted-VM teardown owns final deletion: after target code has run, do
          # not recursively remove a pathname that same-UID code could have rebound.
          umask 022
          cd -- "$source_root"
          PATH="$runtime_root/bin:$PATH" "$CORTEXEL_CI_BUN" run test:package
