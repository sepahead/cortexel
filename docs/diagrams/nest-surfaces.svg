<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1040" width="1080" height="1040" role="img" aria-labelledby="cx-nest-title cx-nest-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="cx-nest-title">From NEST simulator output to honest figures: the two Cortexel surfaces</title>
  <desc id="cx-nest-desc">Caller-owned NEST captures reach figures through two coexisting surfaces. The stable FigureRequestV1 lane currently ships one executable adapter, nest-spike-recorder revision 5, with two noninterchangeable capture branches, leading to validated requests, deterministic SVG and a digest-bound FigureArtifactV1. The legacy VizSpec lane offers raw transforms for device dumps, connection snapshots and positions across 26 skills. Neither lane imports PyNEST or authenticates the producing simulator; R049 release evidence remains NOT_RUN.</desc>
  <defs>
    <marker id="naArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .h1 { font-size: 25px; font-weight: 650; fill: #e2e8f0; }
      .sub { font-size: 13.5px; fill: #94a3b8; }
      .laneTitle { font-size: 14px; font-weight: 700; letter-spacing: 1.4px; }
      .panelTitle { font-size: 14.5px; font-weight: 650; fill: #e2e8f0; }
      .code { font-size: 11.5px; fill: #e2e8f0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .codeDim { font-size: 11px; fill: #94a3b8; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .note { font-size: 12px; fill: #94a3b8; }
      .chip { font-size: 10.5px; font-weight: 650; }
      .foot { font-size: 10.5px; fill: #64748b; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .box { fill: #0b1220; stroke: #1e293b; stroke-width: 1.2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="1040" fill="#050816"/>
  <text x="40" y="52" class="h1">NEST simulator output → honest figures: two coexisting surfaces</text>
  <text x="40" y="78" class="sub">The caller declares what its data IS. Cortexel validates, derives, and renders — it never invents provenance and never imports PyNEST.</text>

  <!-- Source capture panel -->
  <rect x="40" y="106" width="300" height="526" rx="12" class="box"/>
  <rect x="40" y="106" width="300" height="4" rx="2" fill="#136697"/>
  <text x="60" y="140" class="panelTitle">Caller-owned NEST 3.10 capture</text>
  <text x="60" y="170" class="code">spike recorder (memory)</text>
  <text x="60" y="188" class="codeDim">events.senders / events.times</text>
  <text x="60" y="204" class="codeDim">origin, start, stop, n_events</text>
  <text x="60" y="234" class="code">multimeter</text>
  <text x="60" y="250" class="codeDim">V_m, Ca, IP3 traces</text>
  <text x="60" y="280" class="code">get_connections</text>
  <text x="60" y="296" class="codeDim">SynapseCollection snapshot</text>
  <text x="60" y="326" class="code">get_position</text>
  <text x="60" y="342" class="codeDim">identified x/y(/z) positions</text>
  <text x="60" y="372" class="code">weight_recorder</text>
  <text x="60" y="388" class="codeDim">six parallel event arrays</text>
  <text x="60" y="418" class="code">correlation_detector</text>
  <text x="60" y="434" class="codeDim">counts / sums / rates</text>
  <line x1="60" y1="456" x2="320" y2="456" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="482" class="note">Capture is detached and quiescent;</text>
  <text x="60" y="500" class="note">typed arrays, SharedArrayBuffer</text>
  <text x="60" y="518" class="note">drift, and accessors fail closed.</text>
  <text x="60" y="548" class="codeDim">time_in_steps: true unsupported</text>

  <!-- Stable lane -->
  <rect x="380" y="106" width="660" height="286" rx="12" class="box"/>
  <rect x="380" y="106" width="660" height="4" rx="2" fill="#3a6b54"/>
  <text x="400" y="138" class="laneTitle" fill="#3a6b54">STABLE — FigureRequestV1</text>
  <rect x="400" y="154" width="200" height="70" rx="9" fill="#0b1220" stroke="#3a6b54" stroke-width="1.3"/>
  <text x="500" y="180" class="code" text-anchor="middle">nestSpikeRecorderToRaster</text>
  <text x="500" y="198" class="codeDim" text-anchor="middle">cortexel/adapters/nest</text>
  <text x="500" y="214" class="codeDim" text-anchor="middle">executable adapter rev 5</text>
  <path d="M 600 189 L 632 189" stroke="#64748b" stroke-width="1.3" marker-end="url(#naArrow)"/>
  <rect x="632" y="154" width="180" height="70" rx="9" fill="#0b1220" stroke="#c09036" stroke-width="1.3"/>
  <text x="722" y="178" class="code" text-anchor="middle">validateRequestValue</text>
  <text x="722" y="196" class="codeDim" text-anchor="middle">structural + semantic</text>
  <text x="722" y="212" class="codeDim" text-anchor="middle">fail-closed Ajv profile</text>
  <path d="M 812 189 L 844 189" stroke="#64748b" stroke-width="1.3" marker-end="url(#naArrow)"/>
  <rect x="844" y="154" width="176" height="70" rx="9" fill="#0b1220" stroke="#ed9a62" stroke-width="1.3"/>
  <text x="932" y="178" class="code" text-anchor="middle">buildFigureFromValidated</text>
  <text x="932" y="196" class="codeDim" text-anchor="middle">deterministic SVG</text>
  <text x="932" y="212" class="codeDim" text-anchor="middle">+ FigureArtifactV1</text>
  <text x="400" y="252" class="codeDim">two noninterchangeable capture branches:</text>
  <rect x="400" y="262" width="620" height="24" rx="12" fill="#12222b" stroke="#3a6b54" stroke-width="1"/>
  <text x="710" y="278" class="chip" fill="#7ba9c8" text-anchor="middle">finiteStop — projection v1 · capture-authority v3 · window (origin+start, origin+stop]</text>
  <rect x="400" y="292" width="620" height="24" rx="12" fill="#12222b" stroke="#3a6b54" stroke-width="1"/>
  <text x="710" y="308" class="chip" fill="#7ba9c8" text-anchor="middle">positiveInfinityCaptureBounded — projection v2 · authority v4 · window (origin+start, capture]</text>
  <text x="400" y="340" class="codeDim">CLI: cortexel source render nest-spike-recorder capture.json —</text>
  <text x="400" y="356" class="codeDim">adapter, validation, derivation, rendering, publication in one process.</text>
  <text x="400" y="378" class="codeDim">R049 real-NEST receipt: NOT_RUN until a durable isolated receipt exists.</text>

  <!-- Legacy lane -->
  <rect x="380" y="412" width="660" height="220" rx="12" class="box"/>
  <rect x="380" y="412" width="660" height="4" rx="2" fill="#c09036"/>
  <text x="400" y="444" class="laneTitle" fill="#c09036">LEGACY — VizSpec (core/)</text>
  <rect x="400" y="460" width="250" height="84" rx="9" fill="#0b1220" stroke="#c09036" stroke-width="1.3"/>
  <text x="525" y="484" class="code" text-anchor="middle">raw transforms</text>
  <text x="525" y="502" class="codeDim" text-anchor="middle">spikeRecorder / multimeter</text>
  <text x="525" y="518" class="codeDim" text-anchor="middle">synapseCollectionTo* family</text>
  <text x="525" y="534" class="codeDim" text-anchor="middle">ISI · PSTH · rate · correlogram</text>
  <path d="M 650 502 L 682 502" stroke="#64748b" stroke-width="1.3" marker-end="url(#naArrow)"/>
  <rect x="682" y="460" width="150" height="84" rx="9" fill="#0b1220" stroke="#c09036" stroke-width="1.3"/>
  <text x="757" y="488" class="code" text-anchor="middle">buildVizSpec</text>
  <text x="757" y="506" class="codeDim" text-anchor="middle">strict gate</text>
  <text x="757" y="522" class="codeDim" text-anchor="middle">+ honesty caption</text>
  <path d="M 832 502 L 864 502" stroke="#64748b" stroke-width="1.3" marker-end="url(#naArrow)"/>
  <rect x="864" y="460" width="156" height="84" rx="9" fill="#0b1220" stroke="#ed9a62" stroke-width="1.3"/>
  <text x="942" y="488" class="code" text-anchor="middle">26 skills</text>
  <text x="942" y="506" class="codeDim" text-anchor="middle">22 Cortexel scenes</text>
  <text x="942" y="522" class="codeDim" text-anchor="middle">4 host-render routes</text>
  <text x="400" y="572" class="codeDim">routeToScene selects a candidate from classified metadata; ambiguity fails closed</text>
  <text x="400" y="586" class="codeDim">with the exact field → skill map. Scenes never borrow a figure for another analysis.</text>
  <text x="400" y="612" class="note">Manifest v11 mirrors the whole skill axis for non-TypeScript hosts (Python, Rust).</text>

  <!-- Connections from source to lanes -->
  <path d="M 340 220 L 380 200" stroke="#64748b" stroke-width="1.3" marker-end="url(#naArrow)"/>
  <path d="M 340 340 L 380 512" stroke="#64748b" stroke-width="1.3" marker-end="url(#naArrow)"/>

  <!-- Honesty footer panel -->
  <rect x="40" y="668" width="1000" height="300" rx="12" class="box"/>
  <rect x="40" y="668" width="1000" height="4" rx="2" fill="#983307"/>
  <text x="60" y="702" class="panelTitle">What neither surface does — by design</text>
  <text x="60" y="734" class="code">No PyNEST import.</text>
  <text x="60" y="752" class="codeDim">Cortexel consumes detached plain-data captures; it never starts a simulator or a Python runtime.</text>
  <text x="60" y="782" class="code">No authentication of the producing process.</text>
  <text x="60" y="800" class="codeDim">build, floating-point environment, capture timing, topology, and export custody remain caller claims.</text>
  <text x="60" y="830" class="code">No invented analysis.</text>
  <text x="60" y="848" class="codeDim">weight/delay aggregation is declared, never guessed; sampled rasters are refused, not disclosed.</text>
  <text x="60" y="878" class="code">No evidence transfer between surfaces.</text>
  <text x="60" y="896" class="codeDim">legacy gates and stable-contract receipts are separate migration surfaces; each carries its own evidence.</text>
  <text x="60" y="926" class="codeDim">Release evidence ledger: docs/release/evidence-ledger.v1.json — a gate is PASS only with a reproducible receipt.</text>

  <text x="40" y="1008" class="foot">cortexel 0.10.0-dev.0 — docs/diagrams/nest-surfaces.svg — src/adapters/nest, core/nest, core/skills</text>
</svg>
